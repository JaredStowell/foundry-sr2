<form class="{{cssClass}} {{actor.type}} flexcol sr2-entity-sheet" autocomplete="off">
  <header class="sheet-header">
    <img class="profile-img" src="{{actor.img}}" data-edit="img" title="{{actor.name}}" height="72" width="72"/>
    <div class="header-fields">
      <div class="sr2-header-title">
        <h1 class="charname">
          <input name="name" type="text" value="{{actor.name}}" placeholder="{{namePlaceholder}}"/>
        </h1>
      </div>
      <div class="sr2-header-resources">
        <div class="resource sr2-sheet-resource">
          <label class="resource-label">IC Type</label>
          <input name="system.icType" type="text" value="{{system.icType}}" placeholder="Killer, Tar Baby, Trace"/>
        </div>
        <div class="resource sr2-sheet-resource">
          <label class="resource-label">Rating</label>
          <input name="system.rating" type="number" value="{{system.rating}}" data-dtype="Number" min="1" max="12"/>
        </div>
        <div class="resource sr2-sheet-resource">
          <label class="resource-label">Initiative</label>
          <span class="sr2-sheet-badge">{{initiative}}</span>
        </div>
        <div class="resource sr2-sheet-resource sr2-damage-resource">
          <label class="resource-label">Matrix Damage</label>
          <div class="sr2-inline-controls">
            <input class="sr2-damage-input" type="number" name="system.health.value" value="{{system.health.value}}" data-dtype="Number" min="0" max="{{system.health.max}}"/>
            <span>/ {{system.health.max}}</span>
            <button type="button" class="heal-damage sr2-small-action" data-amount="1" title="Repair 1">
              <i class="fas fa-heart"></i>
            </button>
            <button type="button" class="heal-damage sr2-small-action" data-amount="{{system.health.value}}" title="Repair All">
              <i class="fas fa-plus-circle"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <nav class="sheet-tabs tabs" data-group="primary">
    <a class="item" data-tab="main">Main</a>
    <a class="item" data-tab="notes">Notes</a>
  </nav>

  <section class="sheet-body">
    <div class="tab main" data-group="primary" data-tab="main">
      <div class="sr2-entity-grid">
        <section class="sr2-sheet-panel">
          <h3>Matrix Attributes</h3>
          <div class="sr2-sheet-attr-list">
            <div class="sr2-sheet-attr-row">
              <label>Body</label>
              <input type="number" name="system.attributes.body.value" value="{{system.attributes.body.value}}" data-dtype="Number" min="{{system.attributes.body.min}}" max="{{system.attributes.body.max}}"/>
            </div>
            <div class="sr2-sheet-attr-row">
              <label>Quickness</label>
              <input type="number" name="system.attributes.quickness.value" value="{{system.attributes.quickness.value}}" data-dtype="Number" min="{{system.attributes.quickness.min}}" max="{{system.attributes.quickness.max}}"/>
            </div>
            <div class="sr2-sheet-attr-row">
              <label>Strength</label>
              <input type="number" name="system.attributes.strength.value" value="{{system.attributes.strength.value}}" data-dtype="Number" min="{{system.attributes.strength.min}}" max="{{system.attributes.strength.max}}"/>
            </div>
            <div class="sr2-sheet-attr-row">
              <label>Charisma</label>
              <input type="number" name="system.attributes.charisma.value" value="{{system.attributes.charisma.value}}" data-dtype="Number" min="{{system.attributes.charisma.min}}" max="{{system.attributes.charisma.max}}"/>
            </div>
            <div class="sr2-sheet-attr-row">
              <label>Intelligence</label>
              <input type="number" name="system.attributes.intelligence.value" value="{{system.attributes.intelligence.value}}" data-dtype="Number" min="{{system.attributes.intelligence.min}}" max="{{system.attributes.intelligence.max}}"/>
            </div>
            <div class="sr2-sheet-attr-row">
              <label>Willpower</label>
              <input type="number" name="system.attributes.willpower.value" value="{{system.attributes.willpower.value}}" data-dtype="Number" min="{{system.attributes.willpower.min}}" max="{{system.attributes.willpower.max}}"/>
            </div>
            <div class="sr2-sheet-attr-row">
              <label>Force</label>
              <input type="number" name="system.attributes.force.value" value="{{system.attributes.force.value}}" data-dtype="Number" min="{{system.attributes.force.min}}" max="{{system.attributes.force.max}}"/>
            </div>
            <div class="sr2-sheet-attr-row">
              <label>Reaction</label>
              <input type="number" name="system.attributes.reaction.value" value="{{system.attributes.reaction.value}}" data-dtype="Number" min="{{system.attributes.reaction.min}}" max="{{system.attributes.reaction.max}}"/>
            </div>
          </div>
        </section>

        <section class="sr2-sheet-panel">
          <h3>Matrix Profile</h3>
          <div class="sr2-sheet-field-grid">
            <div class="sr2-sheet-field">
              <label>Initiative Formula</label>
              <span class="sr2-sheet-badge">{{initiative}}</span>
            </div>
            <div class="sr2-sheet-field">
              <label>Condition</label>
              <span class="sr2-sheet-badge">{{system.health.value}} / {{system.health.max}}</span>
            </div>
          </div>
        </section>

        <section class="sr2-sheet-panel">
          <h3>Functions</h3>
          <textarea class="sr2-sheet-textarea" name="system.powers" rows="14" placeholder="Describe triggers, attack routines, and special effects.">{{system.powers}}</textarea>
        </section>
      </div>
    </div>

    <div class="tab notes" data-group="primary" data-tab="notes">
      <section class="sr2-sheet-panel sr2-sheet-panel--full">
        <h3>Notes</h3>
        <textarea class="sr2-sheet-textarea" name="system.biography" rows="20" placeholder="Node placement, trigger conditions, and GM notes.">{{system.biography}}</textarea>
      </section>
    </div>
  </section>
</form>
